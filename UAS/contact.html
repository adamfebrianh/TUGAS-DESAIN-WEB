<!DOCTYPE html>
<html>

<head>

    <title>Contact</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

	<body>


		<nav class="navbar navbar-expand-lg">

			<div class="container">

				<a class="navbar-brand" href="index.html">Adam Febrian
				</a>

				<div class="navbar-nav ms-auto">

					<a class="nav-link" href="index.html">Home</a>

					<a class="nav-link" href="profile.html">Profile</a>

					<a class="nav-link" href="gallery.html">Gallery</a>

					<a class="nav-link" href="media.html">Media</a>

					<a class="nav-link" href="contact.html">Contact</a>

				</div>

			</div>

		</nav>

		<div class="container mt-5">


			<div class="card shadow p-4">
				
				<h1>Driver Regist</h1>
				<p>

					Silakan mengisi data untuk menjadi driver F1 2026.

				</p>

			</div>

			<div class="card shadow p-4 mt-4">

				<form>

					<div class="mb-3">

						<label class="form-label">

							Full Name

						</label>

						<input type="text"
						class="form-control">

					</div>

					<div class="mb-3">

						<label class="form-label">

							Place / Date of Birth

						</label>

						<input type="text"
						class="form-control mb-2">

						<input type="date"
						class="form-control">

					</div>




					<div class="mb-3">

						<label class="form-label">Team</label>

						<select class="form-select">

							<option>Mercedes</option>

							<option>McLaren</option>

							<option>Ferrari</option>

							<option>Red Bull</option>

						</select>

					</div>

					<div class="mb-3">

						<label class="form-label">Address</label>

						<textarea class="form-control" rows="4"></textarea>

					</div>

					<div class="mb-3">

						<label class="form-label">Phone Number</label>
						<input type="tel" class="form-control">

					</div>

					<div class="mb-3">

						<label class="form-label"> Driver Seat</label>

						<br>

						<input type="radio" name="seat"> First Driver
						<input type="radio" name="seat" class="ms-3"> Second Driver

					</div>

					<div class="mb-3">

						<label class="form-label"> Driver Category</label>
						<br>
						<input type="checkbox" class="ms-2"> Bronze
						<input type="checkbox" class="ms-2"> Silver
						<input type="checkbox" class="ms-2"> Gold
						<input type="checkbox" class="ms-2"> Platinum
						
					</div>

					<div class="mb-4">

						<label class="form-label">

							Pass Photo

						</label>

						<input type="file"
						class="form-control">

					</div>

					<button class="btn btn-success">
						Submit
					</button>
					
					<button class="btn btn-secondary">Reset
					</button>
				</form>
			</div>
		</div>
		<footer>
			Copyright © 2026
		</footer>

	</body>
</html>
